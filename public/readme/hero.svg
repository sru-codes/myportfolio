      <text x="28" y="197" fill="#FF8FB8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">};</text>
      <text x="28" y="237" fill="#9F7886" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">INTRO SEQUENCE</text>
      <rect x="28" y="254" width="279" height="8" rx="4" fill="#4A2A36"/>
