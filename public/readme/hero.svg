      <text x="28" y="83" fill="#FF8FB8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">const craft = {</text>
      <text x="48" y="113" fill="#E8CDD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">mindset: 'learn by doing',</text>
      <text x="48" y="141" fill="#E8CDD6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">stack: ['React', 'AI', 'Web'],</text>
