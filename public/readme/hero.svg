      <g transform="translate(268)"><rect width="100" height="34" rx="17" fill="#FFD4DF" fill-opacity="0.1" stroke="#FF8FB8" stroke-opacity="0.45"/><text x="50" y="22" fill="#FFEAF0" text-anchor="middle">AI / ML</text></g>
      <g transform="translate(380)"><rect width="112" height="34" rx="17" fill="#FFD4DF" fill-opacity="0.1" stroke="#FF8FB8" stroke-opacity="0.45"/><text x="56" y="22" fill="#FFEAF0" text-anchor="middle">WEBGPU</text></g>
