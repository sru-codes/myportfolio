<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Sru Codes portfolio</title>
  <desc id="desc">A dark pink editorial banner for Sru Codes, an interactive software, AI, and web portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251219"/>
      <stop offset="0.58" stop-color="#3B1C28"/>
      <stop offset="1" stop-color="#5A2440"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF6FAE" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF6FAE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFD4DF" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="1" cy="1" r="1.2" fill="#FFD4DF" fill-opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#160A10" flood-opacity="0.42"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
