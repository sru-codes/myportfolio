<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sru Codes portfolio capability map</title>
  <desc id="desc">Three connected panels describing expressive web, applied intelligence, and experimental systems.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9FA"/>
      <stop offset="1" stop-color="#FDE7EF"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#EC4899" fill-opacity="0.12"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7A284D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="300" rx="24" fill="url(#dots)"/>
  <text x="48" y="48" fill="#3B1C22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="3">ONE PORTFOLIO / THREE MODES</text>
  <path d="M196 177H1004" fill="none" stroke="#EC4899" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="4 10"/>
  <g transform="translate(48 78)" filter="url(#cardShadow)">
    <rect width="336" height="174" rx="22" fill="#2B1720"/>
    <text x="24" y="35" fill="#FF8FB8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">01 / EXPERIENCE</text>
    <text x="24" y="72" fill="#FFF7F8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">Expressive Web</text>
    <text x="24" y="103" fill="#D8BBC5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Cinematic intro · scroll stories</text>
    <text x="24" y="128" fill="#D8BBC5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">motion · 3D cards · tactile details</text>
    <g transform="translate(266 112)">
      <rect width="46" height="34" rx="10" fill="#FF6FAE" fill-opacity="0.18" stroke="#FF8FB8"/>
      <path d="M12 11h22M12 17h16M12 23h19" stroke="#FFD4DF" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(432 78)" filter="url(#cardShadow)">
    <rect width="336" height="174" rx="22" fill="#FFFDFE" stroke="#F3B8CA"/>
    <text x="24" y="35" fill="#D63C7D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">02 / INTELLIGENCE</text>
    <text x="24" y="72" fill="#3B1C22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">Applied AI</text>
    <text x="24" y="103" fill="#765966" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Multi-agent systems · NLP</text>
    <text x="24" y="128" fill="#765966" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">regression · telemetry thinking</text>
    <g transform="translate(265 106)">
      <circle cx="25" cy="25" r="23" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899"/>
      <circle cx="25" cy="25" r="6" fill="#EC4899"/>
      <circle cx="25" cy="7" r="4" fill="#FF8FB8"/>
      <circle cx="41" cy="34" r="4" fill="#FF8FB8"/>
      <circle cx="9" cy="34" r="4" fill="#FF8FB8"/>
      <path d="M25 13v6M30 28l7 4M20 28l-7 4" stroke="#EC4899" stroke-width="2"/>
    </g>
  </g>
  <g transform="translate(816 78)" filter="url(#cardShadow)">
    <rect width="336" height="174" rx="22" fill="#F3D6E2"/>
    <text x="24" y="35" fill="#8E315B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">03 / SYSTEMS</text>
    <text x="24" y="72" fill="#3B1C22" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">Lab Experiments</text>
    <text x="24" y="103" fill="#76505F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">WebGPU · canvas · physics</text>
    <text x="24" y="128" fill="#76505F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">terminal toys · spatial UI</text>
    <g transform="translate(266 105)" fill="none" stroke="#A72E68" stroke-width="2">
      <circle cx="25" cy="25" r="9"/>
      <ellipse cx="25" cy="25" rx="24" ry="10" transform="rotate(28 25 25)"/>
      <ellipse cx="25" cy="25" rx="24" ry="10" transform="rotate(-28 25 25)"/>
      <circle cx="25" cy="25" r="3" fill="#A72E68"/>
    </g>
  </g>
  <g fill="#EC4899">
    <circle cx="196" cy="177" r="5"/>
    <circle cx="580" cy="177" r="5"/>
    <circle cx="964" cy="177" r="5"/>
  </g>
</svg>
