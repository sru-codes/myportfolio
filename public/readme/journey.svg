<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Sru Codes learning journey</title>
  <desc id="desc">A four-step timeline moving from spark to build, break, and learn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#321721"/>
      <stop offset="1" stop-color="#1D1016"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#FFD4DF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#FFD4DF">
    <path d="M0 65H1200M0 130H1200M0 195H1200"/>
    <path d="M100 0V260M300 0V260M500 0V260M700 0V260M900 0V260M1100 0V260"/>
  </g>
  <text x="48" y="47" fill="#FFD4DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3">THE BUILD LOOP</text>
  <text x="1152" y="47" fill="#A97B8D" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" text-anchor="end">I break code so I can learn how to fix it.</text>
  <path d="M150 132H1050" fill="none" stroke="#66404F" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 132H1050" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 16"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(150 132)">
      <circle r="25" fill="#EC4899" stroke="#FFD4DF" stroke-width="5" filter="url(#glow)"/>
      <path d="M-7 1l5 5L9-8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-49" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle">SPARK</text>
      <text y="58" fill="#CDAAB6" font-size="13" text-anchor="middle">GIET CSE</text>
    </g>
    <g transform="translate(450 132)">
      <circle r="25" fill="#B72E6F" stroke="#FF8FB8" stroke-width="5"/>
      <path d="M-9-7h18v14H-9zM-4-12h8M-4 7h8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-49" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle">BUILD</text>
      <text y="58" fill="#CDAAB6" font-size="13" text-anchor="middle">APIs + models</text>
    </g>
    <g transform="translate(750 132)">
      <circle r="25" fill="#7C2857" stroke="#FFB6C9" stroke-width="5"/>
      <path d="M-10-9l20 18M10-9L-10 9" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text y="-49" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle">BREAK</text>
      <text y="58" fill="#CDAAB6" font-size="13" text-anchor="middle">Debugging</text>
    </g>
    <g transform="translate(1050 132)">
      <circle r="25" fill="#472033" stroke="#FFD4DF" stroke-width="5"/>
      <path d="M0-12l4 8 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#FFD4DF"/>
      <text y="-49" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle">LEARN</text>
      <text y="58" fill="#CDAAB6" font-size="13" text-anchor="middle">Ship + iterate</text>
    </g>
  </g>
  <g fill="none" stroke="#FF8FB8" stroke-width="2" stroke-linecap="round" opacity="0.72">
    <path d="M56 176l5 11 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="M1142 177c15 6 21 16 16 28-6 11-18 16-32 12 2-15 7-29 16-40z"/>
  </g>
</svg>
